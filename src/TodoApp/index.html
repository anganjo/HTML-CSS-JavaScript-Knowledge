<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Task Manager - To-Do List Application</title>
    <!-- Tailwind CSS for modern, responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to Separate CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header & Dashboard Stats -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
        <div class="max-w-5xl mx-auto px-4 py-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">TaskFlow Manager</h1>
                    <p class="text-xs text-slate-500">Organize, prioritize, and track your daily work seamlessly</p>
                </div>
            </div>
            
            <!-- Quick Stat Badges -->
            <div class="flex items-center gap-2 text-xs font-medium">
                <div class="bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600">
                    Total: <span id="stat-total" class="font-bold text-slate-900">0</span>
                </div>
                <div class="bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200 text-amber-700">
                    Pending: <span id="stat-pending" class="font-bold">0</span>
                </div>
                <div class="bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 text-emerald-700">
                    Done: <span id="stat-completed" class="font-bold">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto px-4 py-8 sm:px-6 w-full flex-grow">

        <!-- Controls Bar: Add Task Button & Search/Filters -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-6">
            <!-- Search & Filter Controls -->
            <div class="flex flex-col sm:flex-row gap-3 flex-grow">
                <div class="relative flex-grow">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="search-input" placeholder="Search tasks by title or description..." 
                        class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
                </div>
                <select id="filter-status" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
                <select id="filter-priority" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                    <option value="all">All Priorities</option>
                    <option value="High">High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>
            </div>

            <!-- Add New Task Trigger Button -->
            <button onclick="openTaskModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 text-sm whitespace-nowrap">
                <i class="fa-solid fa-plus"></i> Add New Task
            </button>
        </div>

        <!-- Task Grid / List View -->
        <div id="task-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Tasks will be dynamically injected here -->
        </div>

        <!-- Empty State (Hidden by default) -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center">
            <div class="bg-slate-100 text-slate-400 p-4 rounded-full text-3xl mb-3">
                <i class="fa-regular fa-folder-open"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-700">No tasks found</h3>
            <p class="text-sm text-slate-500 max-w-sm mt-1">Get started by creating a new task or clearing your current filter criteria.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        <p>TaskFlow Manager &bull; Built with HTML5, CSS, and JavaScript</p>
    </footer>

    <!-- Add / Edit Task Modal -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">Create New Task</h3>
                <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="task-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="task-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Task Title *</label>
                    <input type="text" id="task-title" required placeholder="e.g. Finish quarterly project review"
                        class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Add any extra details or notes..."
                        class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Priority Level</label>
                    <select id="task-priority" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                </div>

                <div class="flex justify-end gap-3 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium rounded-xl text-sm transition">
                        Cancel
                    </button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl text-sm shadow-md transition">
                        Save Task
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Link to Separate JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
